<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Separate interactive interface proposal for Personal Learning. Sample data only."><title>Personal Learning — Interface study</title><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#main">Skip to learning</a>
<div class="study"><span><i></i> Interface study <span class="study-detail">/ Sample content · App unchanged</span></span><button id="about">What changed? <span aria-hidden="true">↗</span></button></div>
<nav class="rail" aria-label="Workspace"><button data-view="home" aria-label="Home" class="active"></button><button data-view="library" aria-label="Library"></button><button data-view="activity" aria-label="Activity"></button><div class="rail-bottom"><button id="theme" aria-label="Switch to light theme"></button><button class="avatar" aria-label="Preview account">AL</button></div></nav>
<aside class="sidebar" aria-label="Learning history"><div class="sidebar-title"><strong>Personal Learning</strong><button id="collapse" class="icon" aria-label="Collapse sidebar"></button></div><button id="new" class="new"></button><input id="history-search" type="search" placeholder="Search learning" aria-label="Search learning"><div id="history"><div class="tree-row"><button id="expand" class="icon" aria-expanded="false" aria-label="Expand Algebra foundations questions"></button><button id="course">Algebra foundations</button></div><div id="branches" hidden><button data-question="Why is it hard?">Why is it hard?</button><button data-question="Why subtract both sides?">Why subtract both sides?</button></div></div><p id="no-history" hidden>No matching learning.</p></aside>
<main id="main" tabindex="-1"><header class="workspace-header"><div><button class="icon" id="reopen" aria-label="Open sidebar"></button><span id="page-label">New learning</span></div><button id="personalize" class="quiet"></button></header><div id="content"></div></main>
<aside id="pattern" class="pattern" aria-label="Your learning pattern" hidden><div class="panel-header"><h2>Your learning pattern</h2><button id="close-panel" class="icon" aria-label="Close learning pattern"></button></div><form id="preferences"><div class="scope course-field"><span class="scope-dot"></span>This learning</div><div class="course-field field"><label for="struggle">Where are you stuck?</label><textarea id="struggle" placeholder="I can follow examples, but I get stuck doing the steps myself."></textarea></div><div class="scope"><span class="scope-dot global"></span>Across your learning</div><div class="field"><label for="style">Teaching style</label><textarea id="style" placeholder="Keep it casual. Show one example, then let me try."></textarea></div><div class="field"><label for="interest">Interests</label><input id="interest" placeholder="Games, music, football…"></div><div class="course-field field"><label for="context">Course or exam</label><input id="context" placeholder="A course, exam, or deadline"></div><div class="course-field language"><button id="language-choice" type="button" aria-expanded="false"><span>Language: <strong id="language-label">Automatic</strong></span><span class="chevron" aria-hidden="true">⌄</span></button><div id="language-editor" hidden><label for="language-input">Reply language</label><input id="language-input" placeholder="Type a language"><div><button id="language-auto" type="button">Automatic</button><button id="language-apply" type="button">Apply</button></div></div></div><button id="save" type="submit" disabled>Saved</button><small class="local-note">Preview settings only</small></form></aside>
<dialog id="dialog"><div class="dialog-header"><h2 id="dialog-title"></h2><button id="dialog-x" class="icon" aria-label="Close dialog"></button></div><div id="dialog-body"></div><button id="dialog-close" class="secondary">Close</button></dialog>
<script src="script.js"></script></body></html>
